        body {
            font-family: Arial, sans-serif;

            background-color: #121212;

            width: 100%;
            max-width: 800px;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .obrazky-vice {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

            text-align: center;
            max-width: 30%;
            flex-grow: 1;
            min-width: 150px;
        }

            width: 100%;
            height: auto;

            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #otazka-obrazek {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

            color: #e0e0e0;

            margin-top: 2px;

    const darkModePrepninac = document.getElementById('dark-mode-prepninac');

    function setDarkMode(isDark) {
        if (isDark) {
            body.classList.add('dark-mode');
            darkModePrepninac.textContent = 'Režim: Tmavý 🌙';
            localStorage.setItem('darkMode', 'enabled');
        } else {
            body.classList.remove('dark-mode');
            darkModePrepninac.textContent = 'Režim: Světlý ☀️';
            localStorage.setItem('darkMode', 'disabled');
        }
    }

    // Inicializace: Zkontroluje uloženou preferenci
    const savedDarkMode = localStorage.getItem('darkMode');
    if (savedDarkMode === 'enabled') {
        setDarkMode(true);
    } else {
        setDarkMode(false);
    }

    // Listener pro přepínání

        "obrazek": "obrazky2025/274.jpg"
    },
    {
        "otazka": "275. Na vlaku Ex je vykonávána ÚZB v režimu R+Mg. Po zabrzdění na zkoušku brzdy a provedené kontrole stavu zabrzděno obdrží strojvedoucí od vozmistra kontrolujícího účinek brzdy vozidel opětovně pokyn „Zabrzděte“ pro vykonání kontroly správné funkce Mg-brzdy. Jaký úkon na základě tohoto pokynu strojvedoucí provede?",
        "moznosti": [
            "Vypustí vzduch z hlavního potrubí zavedením rychločinného brzdění",
            "Sníží tlak v potrubí o hodnotu 3,5 bar oproti provoznímu tlaku",
            "Přestaví brzdič (ovladač brzdiče) do polohy „Závěr“"
        ],
        "spravna": "Vypustí vzduch z hlavního potrubí zavedením rychločinného brzdění",
        "obrazek": null
    }
];


    // Globální proměnné
    let otazky = [];
    let aktualniOtazkaIndex = 0;
    let skore = 0;
    let odpovedZvolena = false;
    let celkovyPocetOtazek = 0;

    // --- NOVÉ STATISTIKY ---
    let totalSpravne = 0; // Celkový počet správných odpovědí
    let totalSpatne = 0;  // Celkový počet špatných odpovědí
    // -----------------------

    // --- PERZISTENTNÍ PROMĚNNÉ ---
    let celyBalicekOtazekID = []; // ID (Indexy 0-354) otázek v náhodném pořadí
    let indexDalsiOtazky = 0;    // Pozice, odkud se má brát v celyBalicekOtazekID
    const MAX_POCET_OTAZEK = originalniOtazky.length; // 275

    // --- NOVÁ PROMĚNNÁ PRO RECYKLACI OTÁZEK ---
    // Skladuje indexy (0-354) otázek, které v rámci aktuálního kvízu nebyly zodpovězeny správně.
    let nespravneOdpovezeneOriginalniIndexy = [];
    // ------------------------------------------

    const startScreen = document.getElementById('start-screen');
    const kvizElementy = document.getElementById('kviz-elementy');
    const pocetOtazekInput = document.getElementById('pocetOtazek');
    const startTlacitko = document.getElementById('start-tlacitko');
    const otazkaText = document.getElementById('otazka-text');
    const otazkaObrazek = document.getElementById('otazka-obrazek');
    const obrazkyViceKontejner = document.getElementById('obrazky-vice-kontejner');
    const moznostiKontejner = document.getElementById('moznosti-kontejner');
    const dalsiTlacitko = document.getElementById('dalsi-tlacitko');
    const vysledekDiv = document.getElementById('vysledek');
    const pocitadloOtazek = document.getElementById('pocitadlo-otazek');
    const zbyleOtazkyElement = document.getElementById('zbyle-otazky');

    // *** DOPLNĚNÍ CHYBĚJÍCÍ DEFINICE ***
    const statistikyUspesnostiDiv = document.getElementById('statistiky-uspesnosti');

    // --- NOVÝ ELEMENT TLAČÍTKA RESET ---
    const resetStatistikyTlacitko = document.getElementById('reset-statistiky-tlacitko');
    // ------------------------------------


// ----------------------------------------------------
// PERZISTENTNÍ LOGIKA (ULOŽENÍ STAVU DO LOCALSTORAGE)
// ----------------------------------------------------

function ulozitStav() {
    localStorage.setItem('celyBalicekOtazekID', JSON.stringify(celyBalicekOtazekID));
    localStorage.setItem('indexDalsiOtazky', indexDalsiOtazky);
    // NOVÉ: Ukládání statistik
    localStorage.setItem('totalSpravne', totalSpravne);
    localStorage.setItem('totalSpatne', totalSpatne);
}

function zamichatPole(pole) {
    for (let i = pole.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pole[i], pole[j]] = [pole[j], pole[i]];
    }
}

function inicializovatNovyBalicek() {
    // 1. Vytvoří seznam ID (indexů od 0 do MAX_POCET_OTAZEK - 1)
    celyBalicekOtazekID = Array.from({ length: MAX_POCET_OTAZEK }, (_, i) => i);
    // 2. Zamíchá ID
    zamichatPole(celyBalicekOtazekID);
    // 3. Vynuluje index
    indexDalsiOtazky = 0;
    // 4. Uloží stav
    ulozitStav();
}

function nacistNeboInicializovatBalicek() {
    const ulozenyBalicek = localStorage.getItem('celyBalicekOtazekID');
    const ulozenyIndex = localStorage.getItem('indexDalsiOtazky');
    // NOVÉ: Načítání statistik
    const ulozenyTotalSpravne = localStorage.getItem('totalSpravne');
    const ulozenyTotalSpatne = localStorage.getItem('totalSpatne');

    let dataJsouValidni = false;

    // --- OPRAVA CHYBY: KONTROLA VALIDITY DAT ---
    // Pokud máme uložená data, musíme ověřit, zda indexy v nich neukazují na neexistující otázky.
    // To se stane, když se zkrátí seznam otázek v kódu, ale v LocalStorage zůstanou staré indexy.
    if (ulozenyBalicek && ulozenyIndex !== null) {
        try {
            const parsovanyBalicek = JSON.parse(ulozenyBalicek);
            if (parsovanyBalicek.length > 0) {
                // Zkontrolujeme, zda nejvyšší uložený index existuje v aktuálním poli otázek
                const maximalniIndex = Math.max(...parsovanyBalicek);
                if (maximalniIndex < originalniOtazky.length) {
                    dataJsouValidni = true;
                    celyBalicekOtazekID = parsovanyBalicek;
                    indexDalsiOtazky = parseInt(ulozenyIndex);
                } else {
                    console.warn("Zjištěna nekompatibilita dat (staré indexy). Provádím reset.");
                }
            }
        } catch (e) {
            console.error("Chyba při načítání dat:", e);
        }
    }

    // Pokud data nejsou validní nebo neexistují, inicializujeme nový balíček
    if (!dataJsouValidni) {
        inicializovatNovyBalicek();
    }
    // -------------------------------------------

    // NOVÉ: Načtení a inicializace statistik
    totalSpravne = ulozenyTotalSpravne ? parseInt(ulozenyTotalSpravne) : 0;
    totalSpatne = ulozenyTotalSpatne ? parseInt(ulozenyTotalSpatne) : 0;

    // Aktualizace zbývajících otázek a zobrazení statistik
    if (zbyleOtazkyElement && statistikyUspesnostiDiv) {
        const zbyva = celyBalicekOtazekID.length;
        zbyleOtazkyElement.textContent = `Zbývá dokončit: ${zbyva} unikátních otázek z celkového cyklu ${MAX_POCET_OTAZEK}.`;

        // Zobrazení průměrné úspěšnosti
        const celkemOdpovezeno = totalSpravne + totalSpatne;
        const uspesnost = celkemOdpovezeno > 0 ? ((totalSpravne / celkemOdpovezeno) * 100).toFixed(1) : '0.0';

        // NOVÉ zobrazení statistik
        statistikyUspesnostiDiv.innerHTML = `
        <hr style="border-top: 1px solid #ddd; margin: 0 0 15px 0;">
        <h3>Celkové statistiky:</h3>
        <p>Správně: <strong>${totalSpravne}</strong> / Špatně: <strong>${totalSpatne}</strong></p>
        <p id="uspesnost-text" style="font-size: 1.2em; font-weight: bold; margin-bottom: 5px;">Úspěšnost (odpovězeno): ${uspesnost}%</p>
   `;
    }
}

// FUNKCE UPRAVENA: Přidána ochrana proti pádu (filter)
function vybratOtazkyZBalicku(pocet) {
    const vybraneIndexy = celyBalicekOtazekID.slice(indexDalsiOtazky, indexDalsiOtazky + pocet);

    // Mapujeme indexy zpět na objekty otázek
    // PŘIDÁNO .filter: Pokud by se i přesto objevil neplatný index, vyfiltrujeme ho, aby aplikace nespadla
    const vybraneOtazky = vybraneIndexy
        .map(originalIndex => {
            if (!originalniOtazky[originalIndex]) return null; // Ochrana
            return {
                ...originalniOtazky[originalIndex],
                originalniIndex: originalIndex
            };
        })
        .filter(otazka => otazka !== null); // Odstraní prázdné/chybné otázky

    return vybraneOtazky;
}

// Volání při načtení stránky (inicializace)
nacistNeboInicializovatBalicek();

// --- PŘIPOJENÍ ZÁKLADNÍCH LISTENERŮ ---
startTlacitko.addEventListener('click', spustitKviz);
dalsiTlacitko.addEventListener('click', dalsiOtazka);

// NOVÝ LISTENER PRO RESET: POUŽÍVÁME KONTROLU
if (resetStatistikyTlacitko) {
    resetStatistikyTlacitko.addEventListener('click', resetStatistiky);
}

// LISTENER PRO ENTER KLÁVESU NA INPUTU
pocetOtazekInput.addEventListener('keydown', function(event) {
    if (event.keyCode === 13) { 
        event.preventDefault(); 
        startTlacitko.click(); 
    }
});

// ------------------------------------------------------------------
// *** KLÍČOVÝ KÓD PRO ZAJIŠTĚNÍ FUNKČNOSTI VE WEBVIEW ***
// Spustí se se zpožděním, aby se DOM plně vykreslil a klávesnice se aktivovala.
// ------------------------------------------------------------------
setTimeout(() => {
    // 1. Znovu se pokusíme připojit listener pro reset, pro případ, že selhal timing
    if (resetStatistikyTlacitko) {
        // Odebereme pro jistotu staré listenery a přidáme nový
        resetStatistikyTlacitko.removeEventListener('click', resetStatistiky); 
        resetStatistikyTlacitko.addEventListener('click', resetStatistiky);
    }
    
    // 2. Manuální focus (pro mobilní klávesnici)
    if (startScreen.style.display !== 'none' && pocetOtazekInput) {
        pocetOtazekInput.focus();
    }
    
}, 500); // 500 ms zpoždění dává WebView dost času


    function spustitKviz() {
        const pocet = parseInt(pocetOtazekInput.value);

        // Zvolený počet nesmí překročit zbývající otázky v balíčku
        const zbyvaOtazekVBalicku = celyBalicekOtazekID.length;

        if (pocet > 0 && pocet <= MAX_POCET_OTAZEK) {

            // Kontrola konce celého cyklu
            if (zbyvaOtazekVBalicku === 0) {
                 alert(`Celý cyklus ${MAX_POCET_OTAZEK} otázek je dokončen! Bude spuštěn nový cyklus.`);
                 inicializovatNovyBalicek();
                 nacistNeboInicializovatBalicek(); // Aktualizuj zobrazení
                 return;
            }

            // Testujeme jen tolik, kolik zbylo
            const pocetKvizu = Math.min(pocet, zbyvaOtazekVBalicku);

            celkovyPocetOtazek = pocetKvizu;

            // PŘIDÁNO: Vynulovat seznam špatných odpovědí pro nový běh
            nespravneOdpovezeneOriginalniIndexy = [];

            // Použití nové funkce pro výběr otázek z perzistentního balíčku
            otazky = vybratOtazkyZBalicku(pocetKvizu);

            aktualniOtazkaIndex = 0;
            skore = 0;

            startScreen.style.display = 'none';
            vysledekDiv.style.display = 'none';
            kvizElementy.style.display = 'block';

            zobrazOtazku();

        } else {
            alert(`Zvolte platný počet otázek (1 až ${MAX_POCET_OTAZEK}).`);
        }
    }

    function zobrazOtazku() {
    if (aktualniOtazkaIndex >= celkovyPocetOtazek) {
        zobrazVysledek();
        return;
    }

    const otazkaData = otazky[aktualniOtazkaIndex];
    odpovedZvolena = false;
    dalsiTlacitko.disabled = true;

    // Aktualizace počítadla otázek (např. 1/10)
    pocitadloOtazek.textContent = `${aktualniOtazkaIndex + 1}/${celkovyPocetOtazek}`;

    // Zobrazí celý text otázky VČETNĚ ČÍSLA z databáze
    otazkaText.textContent = otazkaData.otazka;

    // --- ZBYTEK LOGIKY PRO OBRÁZKY (ZŮSTÁVÁ STEJNÝ) ---
    otazkaObrazek.style.display = 'none';
    otazkaObrazek.src = '';
    obrazkyViceKontejner.innerHTML = '';
    obrazkyViceKontejner.style.display = 'none';

    if (otazkaData.viceObrazku && otazkaData.viceObrazku.length > 0) {
        obrazkyViceKontejner.style.display = 'flex';

        otazkaData.viceObrazku.forEach(obrazekInfo => {
            const div = document.createElement('div');
            div.classList.add('obrazek-moznost');
            div.innerHTML = `
                <img src="${obrazekInfo.soubor}" alt="Možnost ${obrazekInfo.popis}">
                <p style="margin-top: 5px;">${obrazekInfo.popis}</p>
            `;
            obrazkyViceKontejner.appendChild(div);
        });

    // Nový kód, který zajišťuje míchání možností
    } else if (otazkaData.obrazek) {
        otazkaObrazek.src = otazkaData.obrazek;
        otazkaObrazek.style.display = 'block';
    }
    // --- KONEC LOGIKY PRO OBRÁZKY ---

    // **NOVÁ LOGIKA PRO MÍCHÁNÍ ODPOVĚDÍ**
    // 1. Vytvoříme KOPii pole možností odpovědí, abychom neovlivnili původní data
    const zamichaneMoznosti = [...otazkaData.moznosti];
    // 2. Zamícháme kopii pomocí již existující funkce zamichatPole
    zamichatPole(zamichaneMoznosti);
    // **KONEC NOVÉ LOGIKY**


    moznostiKontejner.innerHTML = '';
    // Vykreslujeme ZAMÍCHANÉ možnosti (používáme zamichaneMoznosti)
    zamichaneMoznosti.forEach(moznost => {
        const tlacitko = document.createElement('button');
        tlacitko.textContent = moznost;
        tlacitko.addEventListener('click', () => zkontrolovatOdpoved(moznost, tlacitko, otazkaData.spravna));
        moznostiKontejner.appendChild(tlacitko);
    });
}

// FUNKCE UPRAVENA: Sleduje špatné odpovědi
function zkontrolovatOdpoved(zvolenaOdpoved, tlacitko, spravnaOdpoved) {
    if (odpovedZvolena) return;
    odpovedZvolena = true;
    dalsiTlacitko.disabled = false;

    const vsechnaTlacitka = moznostiKontejner.querySelectorAll('button');
    vsechnaTlacitka.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === spravnaOdpoved) {
            btn.classList.add('spravne');
        } else if (btn.textContent === zvolenaOdpoved) {
            btn.classList.add('spatne');
        }
    });

    // ... (uvnitř funkce zkontrolovatOdpoved)

    if (zvolenaOdpoved === spravnaOdpoved) {
        skore++;
        // NOVÉ: Inkrementace celkových správných odpovědí
        totalSpravne++;
    } else {
        // NOVÉ: Inkrementace celkových špatných odpovědí
        totalSpatne++;

        // PŮVODNÍ KÓD: Uložení indexu špatné otázky k recyklaci
        const otazkaData = otazky[aktualniOtazkaIndex];
        // Uloží se index 0-354, ne index v rámci aktuálního malého testu
        nespravneOdpovezeneOriginalniIndexy.push(otazkaData.originalniIndex);
    }
}

    function dalsiOtazka() {
        aktualniOtazkaIndex++;
        zobrazOtazku();
    }

// FUNKCE UPRAVENA: Rekonstruuje balíček, aby se špatné otázky opakovaly
// ... (začátek funkce zobrazVysledek() beze změny)

function zobrazVysledek() {

    // **NOVÁ LOGIKA PRO UKLÁDÁNÍ STAVU A RECYKLACI OTÁZEK:**

    // 1. Otázky z aktuálního běhu, které nebyly správně (ty, které se vrací do balíčku)
    const otazkyKRecyklaci = nespravneOdpovezeneOriginalniIndexy;

    // 2. Nový začátek zbytku balíčku (za rozsahem aktuálně testovaných otázek)
    const novyIndexDalsiOtazky = indexDalsiOtazky + celkovyPocetOtazek;

    // 3. Zbytek neotestovaného balíčku (původně za aktuálním testem)
    const zbytekBalicku = celyBalicekOtazekID.slice(novyIndexDalsiOtazky);

    // 4. Vytvoříme NOVÝ celyBalicekOtazekID (Recyklované otázky jdou na začátek, ale budeme míchat)
    let novyCelyBalicek = [...otazkyKRecyklaci];
    novyCelyBalicek.push(...zbytekBalicku);

    // **ZDE JE ZMĚNA: Zamíchání celého nového balíčku**
    zamichatPole(novyCelyBalicek); // Zamíchá recyklované otázky do zbytku balíčku
    // **KONEC ZMĚNY**

    // 5. Aktualizace perzistence
    celyBalicekOtazekID = novyCelyBalicek;
    // indexDalsiOtazky se vrací na 0, protože se testuje z nového, zkráceného balíčku
    indexDalsiOtazky = 0;

    ulozitStav();

// ... (zbytek funkce zobrazVysledek() beze změny)

    // 6. Kontrola konce celého cyklu
    if (celyBalicekOtazekID.length === 0) {
        inicializovatNovyBalicek();
        setTimeout(() => alert(`Gratulace! Všechny otázky byly dokončeny SPRÁVNĚ. Kvíz začíná novým, náhodně zamíchaným cyklem ${MAX_POCET_OTAZEK} otázek.`), 100);
    }

    // Zbytek logiky zobrazení výsledků (beze změny)
    kvizElementy.style.display = 'none';
    vysledekDiv.style.display = 'block';

    const uspesnostProcenta = celkovyPocetOtazek > 0
        ? (skore / celkovyPocetOtazek) * 100
        : 0;

    let nadpisEmotikon;
    let hlaska;
    let barvaHlasky;
    let h1Element = document.querySelector('h1');

    h1Element.classList.remove('vysledek-uspech', 'vysledek-neuspech');

    if (uspesnostProcenta >= 80) {
        nadpisEmotikon = '🎉';
        hlaska = "Jsi za vodou! 👍";
        barvaHlasky = '#28a745';
        h1Element.classList.add('vysledek-uspech');
    } else {
        nadpisEmotikon = '👎';
        hlaska = "Jsi V P***li 😤";
        barvaHlasky = '#dc3545';
        h1Element.classList.add('vysledek-neuspech');
    }

    vysledekDiv.innerHTML = `
        <h2>Kvíz dokončen! ${nadpisEmotikon}</h2>
        <p>Vaše skóre je: ${skore} / ${celkovyPocetOtazek}</p>
        <p style="font-size: 1.2em; font-weight: bold;">Úspěšnost: ${uspesnostProcenta.toFixed(1)}%</p>
        <h3 style="color: ${barvaHlasky}; margin: 20px 0;">${hlaska}</h3>
        <button id="restart-tlacitko" style="margin-top: 20px;">Restartovat kvíz</button>
    `;
    document.getElementById('restart-tlacitko').addEventListener('click', restartKvizu);
}
    // --- NOVÁ FUNKCE PRO RESET STATISTIK BEZ DIALOGU ---
function resetStatistiky() {
    // Odstraněno "const potvrzeni = confirm(...);"
    
    // Nastavíme upozornění, že se akce provádí
    alert("Celkové statistiky se resetují. Klikněte OK.");
    
    // Tento blok se nyní provede okamžitě
    totalSpravne = 0;
    totalSpatne = 0;
    localStorage.removeItem('totalSpravne');
    localStorage.removeItem('totalSpatne');

    // Znovu načíst a zobrazit aktualizované statistiky
    nacistNeboInicializovatBalicek();

    // Dříve bylo uvnitř if, nyní je vždy
    alert("Statistiky úspěšnosti byly vynulovány. Můžete začít s čistým štítem! 👍");
}
// ----------------------------------------------------

    // FUNKCE UPRAVENA: Aktualizuje perzistentní stav
    function restartKvizu() {
    // 1. Vynulování zadané hodnoty
    pocetOtazekInput.value = ''; 

    // 2. Přesun na startovací obrazovku
    vysledekDiv.style.display = 'none';
    startScreen.style.display = 'block';

    // 3. Znovu načtení stavu pro aktualizaci zobrazení zbývajících otázek
    nacistNeboInicializovatBalicek(); 

    // 4. (Volitelné) Zajistí okamžité zaostření
    pocetOtazekInput.focus(); 
}
</script>
